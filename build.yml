name: Build Hello Chat APKs

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Extract Android projects
        run: |
          unzip -q HelloChat_Android_Starter_Corrected.zip -d extracted
          test -f extracted/HelloChat_Android_Starter/HelloChat/app/build.gradle.kts
          test -f extracted/HelloChat_Android_Starter/HelloChatAdmin/app/build.gradle.kts

      - name: Build Hello Chat APK
        run: gradle -p extracted/HelloChat_Android_Starter/HelloChat assembleDebug

      - name: Build Hello Chat Admin APK
        run: gradle -p extracted/HelloChat_Android_Starter/HelloChatAdmin assembleDebug

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Hello-Chat-APKs
          path: |
            extracted/HelloChat_Android_Starter/HelloChat/app/build/outputs/apk/debug/*.apk
            extracted/HelloChat_Android_Starter/HelloChatAdmin/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
